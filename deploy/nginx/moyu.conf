# 墨语 MoYu Nginx 生产反向代理配置示例
# 放置路径参考: /etc/nginx/conf.d/moyu.conf

upstream moyu_backend {
    server 127.0.0.1:8321;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com; # 替换为实际域名或 VPS 公网 IP

    # 上传附件与导出文件大小限制
    client_max_body_size 50M;

    # 静态资源强缓存与 Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://moyu_backend;
        proxy_http_version 1.1;

        # 标准代理请求头透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 针对 AI 修撰、长文本生成和 SSE 流式输出，必须关闭代理缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}