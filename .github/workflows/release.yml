name: 墨语 MoYu 自动化版本发布与构建 (Release)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建 Windows 原生桌面版并创建 Release
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装项目与打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller fonttools brotli

      - name: 执行自动化回归测试
        run: |
          python -m pytest -q

      - name: 执行 Windows 桌面版打包 (PyInstaller)
        run: |
          python build_exe.py

      - name: 检查打包产物
        shell: pwsh
        run: |
          Get-ChildItem dist/

      - name: 发布至 GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}"             --title "墨语 MoYu ${{ github.ref_name }}"             --generate-notes             dist/*.exe dist/*.sha256 dist/manifest.json
