name: 墨语 MoYu 自动化版本发布与构建 (Release)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建 Windows 原生桌面版并创建 Release
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装项目与打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller fonttools brotli

      - name: 执行自动化回归测试
        run: |
          python -m pytest -q

      - name: 执行 Windows 桌面版打包 (PyInstaller)
        run: |
          python build_exe.py

      - name: 检查打包产物
        shell: pwsh
        run: |
          Get-ChildItem dist/

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: 墨语 MoYu ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist/*.exe
            dist/*.sha256
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
